<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiencia WebAR: Rohn & Tracy - Juan Oquendo</title>
  
  <!-- Librerías de AR y 3D -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    #instrucciones {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(15, 15, 25, 0.9);
      color: #FFD700;
      padding: 12px 22px;
      border-radius: 25px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      text-align: center;
      border: 1px solid #FFD700;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="instrucciones">Apunta tu cámara hacia la tarjeta para activar la experiencia</div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="capaAnimada" src="./animacion.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Objeto detectado por la cámara -->
    <a-entity mindar-image-target="targetIndex: 0">
      
      <!-- Elemento gráfico flotante animado -->
      <a-plane 
        src="#capaAnimada" 
        position="0 0.15 0.1" 
        height="0.75" 
        width="0.75" 
        material="transparent: true"
        animation="property: position; to: 0 0.3 0.1; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine">
      </a-plane>

      <!-- Texto 3D: Citas de Jim Rohn y Brian Tracy -->
      <a-text 
        value="Jim Rohn: Trabaja mas duro en ti que en tu empleo.\nBrian Tracy: Planifica cada dia antes de empezar." 
        align="center" 
        color="#FFFFFF" 
        position="0 -0.55 0.15" 
        scale="0.4 0.4 0.4">
      </a-text>

      <a-text 
        value="By: Juan Oquendo" 
        align="center" 
        color="#FFD700" 
        position="0 -0.75 0.15" 
        scale="0.35 0.35 0.35">
      </a-text>

    </a-entity>

  </a-scene>

</body>
</html>
